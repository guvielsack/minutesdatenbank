<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minutesdatenbank</title>
  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet" />
  <link href="/static/css/app.css?v=6" rel="stylesheet" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="project-meta">
        <label class="project-field">
          <span class="label">Project:</span>
          <input id="project-name" />
        </label>
        <label class="project-field">
          <span class="label">Team:</span>
          <input id="project-meeting" />
          <input id="project-participants" />
        </label>
      </div>
      <div class="header-right">
        <div class="auth-bar" id="auth-bar">
          <span id="auth-role-label">Lesemodus</span>
          <a id="login-link" href="/login">Anmelden</a>
          <a id="admin-link" href="/admin" class="hidden">Benutzer</a>
          <button type="button" id="logout-btn" class="hidden">Abmelden</button>
        </div>
        <div class="header-meta">
          <span class="today">Heute: <strong id="today-label"></strong></span>
          <span class="row-count" id="minutes-row-count"></span>
        </div>
      </div>
    </div>
    <div class="toolbar" id="minutes-toolbar">
      <button data-action="meeting" data-requires-write>+ Meeting</button>
      <button data-action="task" data-requires-write>+ Task</button>
      <button data-action="decision" data-requires-write>+ Decision</button>
      <button data-action="information" data-requires-write>+ Information</button>
      <button data-action="agenda" data-requires-write>+ Agenda</button>
      <span class="sep"></span>
      <button data-action="open-tasks">Offene Aufgaben</button>
      <button type="button" data-action="open-tasks-pdf">PDF offene Aufgaben</button>
      <button data-action="all-rows">Alle Zeilen</button>
      <span class="sep"></span>
      <label class="toolbar-field">
        <span>Meeting-Protokoll</span>
        <select id="meeting-protocol-select">
          <option value="">Datum wählen…</option>
        </select>
      </label>
      <button type="button" data-action="meeting-protocol">PDF</button>
      <button type="button" data-action="import" data-requires-admin>Excel importieren…</button>
      <input
        id="excel-import-input"
        type="file"
        accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12"
        hidden
      />
    </div>
  </header>

  <nav class="sheet-tabs">
    <button class="tab active" data-sheet="minutes">Minutes</button>
    <button class="tab" data-sheet="year-plan">Jahresdetail-Plan</button>
  </nav>

  <main>
    <div id="minutes-boot-shell" class="boot-pending">
      <div id="minutes-boot-status" aria-live="polite">Minutes werden geladen…</div>
      <div id="minutes-table" class="sheet-panel active"></div>
    </div>
    <div id="year-plan-table" class="sheet-panel"></div>
  </main>

  <div id="row-context-menu" class="context-menu hidden" role="menu">
    <button type="button" data-action="move-up" role="menuitem">Eine Zeile nach oben</button>
    <button type="button" data-action="move-down" role="menuitem">Eine Zeile nach unten</button>
    <button type="button" data-action="copy-row" role="menuitem">Zeile kopieren</button>
    <button type="button" data-action="paste-row" role="menuitem" class="hidden" id="paste-row-menu-item">Kopierte Zeile einfügen</button>
    <button type="button" data-action="insert-row" role="menuitem">Zeile einfügen</button>
    <button type="button" data-action="delete-row" role="menuitem">Zeile löschen</button>
  </div>

  <div id="paste-row-dialog" class="modal" role="dialog" aria-labelledby="paste-row-title" aria-hidden="true">
    <form id="paste-row-form" class="modal-card">
      <h2 id="paste-row-title">Kopierte Zeile einfügen</h2>
      <p id="paste-row-hint" class="modal-hint">Wie soll die kopierte Zeile eingefügt werden?</p>
      <label class="modal-option">
        <input type="radio" name="paste-row-mode" value="overwrite" checked />
        <span>Zielzeile überschreiben</span>
      </label>
      <label class="modal-option">
        <input type="radio" name="paste-row-mode" value="below" />
        <span>Unterhalb der Zielzeile einfügen</span>
      </label>
      <div class="modal-actions">
        <button type="submit">Einfügen</button>
        <button type="button" data-action="cancel-paste-row">Abbrechen</button>
      </div>
    </form>
  </div>

  <div id="meeting-create-dialog" class="modal" role="dialog" aria-labelledby="meeting-create-title" aria-hidden="true">
    <form id="meeting-create-form" class="modal-card">
      <h2 id="meeting-create-title">Neues Meeting</h2>
      <p id="meeting-create-hint" class="modal-hint"></p>
      <label class="modal-option">
        <input type="radio" name="meeting-create-mode" value="row" checked />
        <span>Nur Meeting-Zeile</span>
      </label>
      <label class="modal-option">
        <input type="radio" name="meeting-create-mode" value="agenda" />
        <span>Meeting mit Agenda vom vorherigen Meeting kopieren</span>
      </label>
      <label id="meeting-create-date-field" class="modal-date-field hidden">
        <span>Datum des neuen Meetings</span>
        <input id="meeting-create-date" type="date" required />
      </label>
      <div class="modal-actions">
        <button type="submit">Erstellen</button>
        <button type="button" data-action="cancel-meeting-create">Abbrechen</button>
      </div>
    </form>
  </div>

  <div id="column-filter-menu" class="column-filter-menu hidden" role="dialog" aria-label="Spaltenfilter">
    <button type="button" class="column-filter-clear hidden" data-action="clear-filter">Filter entfernen</button>
    <input id="column-filter-search" type="search" placeholder="Suchen" />
    <label class="column-filter-select-all-row">
      <input id="column-filter-select-all" type="checkbox" />
      <span>(Alles auswählen)</span>
    </label>
    <div class="column-filter-options"></div>
    <div class="column-filter-actions">
      <button type="button" data-action="ok">OK</button>
      <button type="button" data-action="cancel">Abbrechen</button>
    </div>
  </div>

  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="/static/js/column-filters.js?v=15"></script>
  <script src="/static/js/app.js?v=37"></script>
</body>
</html>
