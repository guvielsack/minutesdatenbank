<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – minutesdatenbank</title>
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>minutesdatenbank</h1>
    <p class="login-hint">Anmelden als Admin oder Protokollant. Lesen ist ohne Anmeldung möglich.</p>
    <form id="login-form">
      <label>
        <span>Benutzername</span>
        <input id="login-username" type="text" autocomplete="username" required />
      </label>
      <label>
        <span>Passwort</span>
        <input id="login-password" type="password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="login-error hidden"></p>
      <div class="login-actions">
        <button type="submit">Anmelden</button>
        <a href="/">Zurück (nur lesen)</a>
      </div>
    </form>
  </main>
  <script src="/static/js/login.js?v=1"></script>
</body>
</html>
